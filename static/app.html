<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Command centre — Commerce Control Plane</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /* Palette and proportions are the reference page's, unchanged. */
  :root{
    --white:#FFFFFF;
    --ink:#1A1A1E; --ink-2:#2E2E33; --muted:#6E6E76; --faint:#8A8A92;
    --placeholder:#9EA0A6;
    --blue:#3D6FF5; --blue-border:#4A7CF8; --blue-hi:#2F5FE0;
    --blue-soft:#E8ECF7;
    --line:#EFEFF2; --btn-line:#E2E2E7; --rule:#F2F2F5;
    --allow:#1D7F4C; --block:#C4362B;
    --f:-apple-system,BlinkMacSystemFont,"SF Pro Display",
       "Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--f);color:var(--ink);font-size:16px;
    line-height:1.5;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(58% 62% at 2% 16%,  #BDD6F2 0%, rgba(189,214,242,0) 62%),
      radial-gradient(50% 56% at 20% 94%, #AFCDEC 0%, rgba(175,205,236,0) 60%),
      radial-gradient(54% 58% at 99% 30%, #E5CFDE 0%, rgba(229,207,222,0) 62%),
      radial-gradient(50% 56% at 84% 12%, #EBD9E6 0%, rgba(235,217,230,0) 62%),
      radial-gradient(44% 50% at 76% 97%, #E7DCEE 0%, rgba(231,220,238,0) 60%),
      radial-gradient(66% 52% at 50% 4%,  #EDF1F9 0%, rgba(237,241,249,0) 72%),
      #EDF1F9;
    background-attachment:fixed;
    min-height:100vh;padding:1rem 1.5rem 4rem;text-align:center}

  /* Signed-in strip. Sits on the wash rather than on a white bar, so the
     page reads as one surface the way the reference does. */
  .top{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    max-width:58rem;margin:0 auto 1.6rem;font-size:.83rem;color:var(--muted)}
  .top button{font-family:inherit;font-size:.83rem;color:var(--muted);
    background:none;border:0;cursor:pointer;padding:0}
  .top button:hover{color:var(--ink)}
  .right{display:flex;align-items:center;gap:1rem}

  /* Two things a merchant does here, named. Without them the prompt box has
     to carry every job at once, and a shopper request and an integration
     request look identical to somebody seeing this for the first time. */
  .nav{display:flex;align-items:center;gap:.35rem}
  .nav button{display:inline-flex;align-items:center;gap:.4rem;
    font-family:inherit;font-size:.84rem;font-weight:500;color:var(--muted);
    background:none;border:0;border-radius:8px;padding:.42rem .7rem;
    cursor:pointer;transition:.15s;white-space:nowrap}
  .nav button:hover{background:var(--white);color:var(--ink)}
  .nav button[aria-current="true"]{background:var(--white);color:var(--ink);
    font-weight:600;box-shadow:0 1px 2px rgba(20,22,26,.07)}
  .nav svg{width:15px;height:15px;flex:none}

  .inner{max-width:58rem;margin:0 auto}

  .greet{font-size:.95rem;color:var(--ink-2);margin:0 0 1.15rem}
  .greet a{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}

  h1{font-weight:700;letter-spacing:-.032em;
    font-size:clamp(1.75rem,4.4vw,2.4rem);line-height:1.14;
    margin:0 auto 2rem;max-width:22ch;text-wrap:balance;
    display:flex;align-items:center;justify-content:center;gap:.55rem;
    flex-wrap:wrap}
  .mark{width:24px;height:24px;flex:none;color:var(--blue)}

  .box{background:var(--white);border:2px solid var(--blue-border);
    border-radius:15px;max-width:35.5rem;margin:0 auto;text-align:left;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(74,124,248,.08),
               0 8px 28px -10px rgba(74,124,248,.20)}
  .box textarea{width:100%;border:0;background:none;resize:none;
    font-family:inherit;font-size:.97rem;color:var(--ink);
    padding:1.1rem 1.2rem .4rem;min-height:4.4rem;outline:none;display:block}
  .box textarea::placeholder{color:var(--placeholder)}
  .boxfoot{display:flex;justify-content:space-between;align-items:center;
    padding:.3rem .75rem .75rem 1.2rem}
  .boxnote{font-size:.79rem;color:var(--muted)}
  .send{width:28px;height:28px;border-radius:7px;border:0;flex:none;
    background:var(--blue-soft);color:var(--blue);cursor:pointer;
    display:grid;place-items:center;font-size:.85rem;transition:.16s}
  .send:hover{background:var(--blue);color:#fff}
  .send:disabled{opacity:.4;cursor:not-allowed}

  .actions{display:flex;gap:.65rem;justify-content:center;flex-wrap:wrap;
    margin:1.45rem 0 0}
  .btn{font-family:inherit;font-size:.9rem;font-weight:600;
    padding:.7rem 1.35rem;border-radius:8px;cursor:pointer;
    border:1px solid transparent;display:inline-flex;align-items:center;
    gap:.42rem;transition:.16s}
  .btn.primary{background:var(--blue);color:#fff;
    box-shadow:0 1px 2px rgba(61,111,245,.25)}
  .btn.primary:hover{background:var(--blue-hi)}
  .btn.ghost{background:var(--white);color:var(--ink-2);
    border-color:var(--btn-line)}
  .btn.ghost:hover{border-color:var(--faint)}
  .btn svg{width:14px;height:14px;flex:none}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(15.5rem,1fr));
    gap:1.1rem;max-width:58rem;margin:3.2rem auto 0;text-align:left}
  .card{background:var(--white);border:1px solid rgba(255,255,255,.7);
    border-radius:13px;padding:1.15rem 1.3rem 1.4rem;cursor:pointer;
    font-family:inherit;text-align:left;
    box-shadow:0 1px 2px rgba(20,22,26,.04),
               0 10px 30px -16px rgba(20,22,26,.22);
    transition:.3s cubic-bezier(.16,1,.3,1)}
  .card:hover{transform:translateY(-3px);
    box-shadow:0 2px 4px rgba(20,22,26,.05),
               0 18px 44px -18px rgba(20,22,26,.28)}
  .card .lab{font-size:.76rem;color:var(--muted);margin:0 0 .5rem;font-weight:500}
  .card .big{font-size:1.02rem;font-weight:600;letter-spacing:-.018em;
    margin:0 0 .35rem;line-height:1.35;color:var(--ink)}
  .card .sm{font-size:.86rem;color:var(--muted);margin:0;line-height:1.5}

  /* answers, in the same card language */
  #result{max-width:35.5rem;margin:1.4rem auto 0;text-align:left}
  .panel{background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:1.3rem 1.4rem;
    box-shadow:0 1px 3px rgba(20,22,26,.05),
               0 10px 30px -14px rgba(20,22,26,.16)}
  .panel.ok{border-top:2.5px solid var(--allow)}
  .panel.no{border-top:2.5px solid var(--block)}
  .verdict{font-size:.78rem;font-weight:600;margin:0 0 .9rem}
  .verdict.ok{color:var(--allow)} .verdict.no{color:var(--block)}
  .lines{margin:0 0 .9rem;padding:0;list-style:none}
  .lines li{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;
    border-bottom:1px solid var(--rule);font-size:.92rem}
  .lines li:last-child{border-bottom:0}
  .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;
    white-space:nowrap;font-size:.88rem}
  .total{display:flex;justify-content:space-between;align-items:baseline;
    padding-top:.75rem;border-top:1px solid var(--ink)}
  .total .l{font-size:.76rem;color:var(--muted)}
  .total .v{font-size:1.4rem;font-weight:700;letter-spacing:-.028em;
    font-variant-numeric:tabular-nums}
  .checks{margin-top:1.1rem;padding-top:.9rem;border-top:1px solid var(--rule)}
  .checks h4{font-size:.73rem;color:var(--faint);margin:0 0 .55rem;font-weight:500}
  .chk{display:grid;grid-template-columns:2.6rem 6.6rem 1fr;gap:.55rem;
    align-items:baseline;padding:.3rem 0;font-size:.81rem}
  .chk .m{font-family:var(--mono);font-size:.62rem;font-weight:600}
  .chk.pass .m{color:var(--allow)} .chk.fail .m{color:var(--block)}
  .chk.not_configured .m{color:var(--faint)} .chk.not_configured{opacity:.6}
  .chk .r{font-family:var(--mono);font-size:.71rem;color:var(--ink-2)}
  .chk .w{color:var(--muted)}
  .status{font-size:.86rem;color:var(--muted);text-align:center;padding:1.4rem 0}
  .note{background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:1.1rem 1.3rem;font-size:.88rem;color:var(--ink-2);
    box-shadow:0 1px 3px rgba(20,22,26,.05),
               0 10px 30px -14px rgba(20,22,26,.16)}

  .picker{max-width:35.5rem;margin:1.4rem auto 0;text-align:left;
    background:var(--white);border:1px solid var(--line);border-radius:14px;
    padding:1.4rem 1.5rem;
    box-shadow:0 1px 3px rgba(20,22,26,.05),
               0 10px 30px -14px rgba(20,22,26,.16)}
  .picker h3{font-size:1.05rem;font-weight:600;letter-spacing:-.02em;
    margin:0 0 1.1rem}
  .picker .grp{font-size:.76rem;color:var(--faint);margin:0 0 .55rem;
    font-weight:500}
  .picker .grp + .row{margin-bottom:1.15rem}
  .picker .row:last-child{margin-bottom:0}
  .row{display:flex;flex-wrap:wrap;gap:.5rem}
  .tool{font-family:inherit;font-size:.87rem;font-weight:500;color:var(--ink-2);
    background:var(--white);border:1px solid var(--btn-line);border-radius:9px;
    padding:.55rem .9rem;cursor:pointer;transition:.15s}
  .tool:hover{border-color:var(--blue-border);color:var(--blue)}

  /* ---------- chat mode ----------
     Once a conversation starts the hero gets out of the way: the greeting,
     headline and cards are for an empty workspace, not a thread. The prompt
     box stays and moves to the bottom, which is where you look for it once
     there are messages above. */
  body.chatting .greet,
  body.chatting h1,
  body.chatting .cards,
  body.chatting .actions{display:none}

  body.chatting{padding-bottom:9rem}

  .thread{max-width:35.5rem;margin:0 auto;text-align:left;
    display:flex;flex-direction:column;gap:1.1rem}

  .bubble{max-width:88%;font-size:.95rem;line-height:1.5}
  .bubble.me{align-self:flex-end;background:var(--white);
    border:1px solid var(--line);border-radius:14px;padding:.7rem 1.05rem;
    box-shadow:0 1px 2px rgba(20,22,26,.05)}
  .bubble.them{align-self:flex-start;width:100%}

  /* The agent's reply is assembled from database rows, not written by a
     model, so it arrives as plain lines with its own spacing already in it.
     pre-wrap keeps that layout without turning the text into markup. */
  .answer{background:var(--white);border:1px solid var(--line);
    border-radius:14px;padding:1rem 1.15rem;white-space:pre-wrap;
    font-size:.92rem;line-height:1.6;color:var(--ink-2)}
  .prompt{background:var(--white);border:1px solid var(--line);
    border-radius:14px;padding:1rem 1.15rem;margin:.6rem 0 0;
    font-family:var(--mono,ui-monospace,Consolas,monospace);font-size:.78rem;
    line-height:1.55;color:var(--ink-2);overflow-x:auto;white-space:pre}

  /* The prompt is code the merchant will paste into an editor, so it is set
     dark and monospaced — it should read as a terminal, not as prose. Fixed
     colours rather than tokens: this panel looks the same in either theme,
     the way a code block does everywhere else it appears. */
  .lead{font-size:.93rem;color:var(--ink-2);margin:0 0 .75rem;line-height:1.6}
  .code{background:#1E1B2E;border:1px solid #2E2A44;border-radius:14px;
    overflow:hidden;box-shadow:0 8px 30px -14px rgba(20,22,26,.45)}
  .codebar{display:flex;align-items:center;justify-content:space-between;
    gap:1rem;padding:.7rem .8rem .7rem 1.1rem;border-bottom:1px solid #2E2A44}
  .codetitle{font-size:.82rem;font-weight:600;color:#B9B3D6;
    letter-spacing:-.01em}
  .copy{font-family:inherit;font-size:.78rem;font-weight:600;
    padding:.35rem .85rem;border-radius:7px;border:1px solid #3A3556;
    background:#282341;color:#D9D4F0;cursor:pointer;transition:.15s;
    white-space:nowrap}
  .copy:hover{background:#332C52;border-color:#4A4370}
  .codebody{margin:0;padding:1.1rem;overflow-x:auto;white-space:pre;
    font-family:var(--mono,ui-monospace,Consolas,monospace);font-size:.74rem;
    line-height:1.7;color:#C6C0E4;tab-size:2}
  .warn{margin:.6rem 0 0;font-size:.79rem;color:var(--faint);line-height:1.55}

  /* Four squares rather than a list. A connector picker is scanned by logo
     before it is read, and equal tiles say the four are alternatives to each
     other in a way stacked rows do not. */
  /* minmax(0,1fr), not 1fr. A bare 1fr is minmax(auto,1fr), so a tile whose
     content is wider than its share refuses to shrink and pushes the last one
     outside the card — which is exactly what "Facebook, Instagram" did. */
  .conns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:.65rem;margin:1rem 0 0}
  @media (max-width:640px){
    .conns{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .conn{position:relative;aspect-ratio:1;min-width:0;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    gap:.5rem;text-align:center;padding:.9rem .55rem;font-family:inherit;
    cursor:pointer;background:var(--white);border:1px solid var(--btn-line);
    border-radius:14px;transition:.18s cubic-bezier(.16,1,.3,1)}
  .conn:hover{transform:translateY(-2px);border-color:var(--faint);
    box-shadow:0 8px 24px -14px rgba(20,22,26,.35)}
  .conn svg{width:34px;height:34px;flex:none}
  .connname{margin:0;max-width:100%;font-size:.85rem;font-weight:600;
    color:var(--ink);letter-spacing:-.015em;line-height:1.25;
    overflow-wrap:anywhere}
  .connwhat{margin:0;max-width:100%;font-size:.72rem;color:var(--muted);
    line-height:1.4;overflow-wrap:anywhere}

  /* Labelled rather than disabled. A connector that does something real, just
     less than the others, should still be reachable — and saying which part
     works is more use than a greyed-out button. */
  .soon{position:absolute;top:.55rem;right:.55rem;font-size:.62rem;
    font-weight:500;color:var(--faint);border:1px solid var(--btn-line);
    border-radius:5px;padding:.08rem .3rem;letter-spacing:0}

  .wa{margin:.9rem 0 0}
  .wabody{background:var(--white);border:1px solid var(--line);
    border-radius:14px;padding:1.1rem;text-align:center}
  /* White plate behind the code: a QR on a tinted background is read less
     reliably, and a merchant blames their phone before they blame the page. */
  .qr{width:210px;height:210px;display:block;margin:0 auto .7rem;
    background:#fff;border-radius:10px;padding:8px;image-rendering:pixelated}
  .wabody .sm{font-size:.79rem;color:var(--muted);line-height:1.55}
  .waok{font-size:.92rem;font-weight:600;color:var(--allow);line-height:1.6}
  .waok .sm{font-weight:400;color:var(--muted)}
  .bubble.said{color:var(--ink-2);padding:0 .2rem}

  .thinking{display:inline-flex;align-items:center;gap:.45rem;
    font-size:.88rem;color:var(--muted);padding:.2rem}
  .thinking i{width:5px;height:5px;border-radius:50%;background:var(--muted);
    display:inline-block;animation:pulse 1.2s ease-in-out infinite}
  .thinking i:nth-child(2){animation-delay:.15s}
  .thinking i:nth-child(3){animation-delay:.3s}
  @keyframes pulse{0%,80%,100%{opacity:.25}40%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.thinking i{animation:none;opacity:.6}}

  /* The composer docks to the bottom once a thread exists. */
  body.chatting .composer{position:fixed;left:0;right:0;bottom:0;
    padding:1rem 1.5rem 1.4rem;
    background:linear-gradient(180deg,rgba(237,241,249,0),#EDF1F9 38%);
    z-index:5}
  body.chatting .box{margin:0 auto}

  :focus-visible{outline:2px solid var(--blue);outline-offset:3px;
    border-radius:6px}
</style>
</head>
<body>

<div class="top">
  <nav class="nav" aria-label="Sections">
    <button id="nav-search" aria-current="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
      Search</button>
    <button id="nav-integration" aria-current="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
        aria-hidden="true">
        <path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/>
        <path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
      Integration</button>
  </nav>

  <div class="right">
    <span id="whoami"></span>
    <button id="signout">Sign out</button>
  </div>
</div>

<div class="inner">
  <p class="greet" id="greet">Loading your workspace…</p>

  <h1>
    <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="2.5" y="10" width="19" height="11.5" rx="2.5"
        stroke="currentColor" stroke-width="2"/>
      <path d="M7 10V6.5a5 5 0 0 1 10 0V10" stroke="currentColor"
        stroke-width="2" stroke-linecap="round"/>
    </svg>
    Let's make you sellable to AI buyers
  </h1>

  <div class="thread" id="thread"></div>

  <div class="composer">
    <form class="box" id="form">
      <textarea id="q" rows="3" aria-label="Ask the command centre"
        placeholder="Ask for anything — integrate with your site, or shop the way a customer would…"></textarea>
      <div class="boxfoot">
        <span class="boxnote" id="note">the model proposes · the policy engine decides</span>
        <button class="send" type="submit" id="go" aria-label="Send">&uarr;</button>
      </div>
    </form>
  </div>

  <div class="actions">
    <button class="btn primary" data-try="integrate this with my website">
      Integrate with my website with a prompt</button>
    <button class="btn ghost" id="later">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      I'll do it later</button>
  </div>

  <div class="cards">
    <button class="card" data-try="integrate this with my website">
      <p class="lab">Integration</p>
      <p class="big">Connect your store in one prompt.</p>
      <p class="sm">Pick your coding tool and copy a ready-made prompt into it.</p>
    </button>
    <button class="card" data-try="import my product catalog">
      <p class="lab">Catalog</p>
      <p class="big">Make your products agent-readable.</p>
      <p class="sm">Import a product list and an AI buyer can find and buy from it.</p>
    </button>
    <button class="card" data-try="what limits protect my margins">
      <p class="lab">Policy</p>
      <p class="big">Set limits the AI cannot move.</p>
      <p class="sm">A discount cap is enough. Your cost stays yours.</p>
    </button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = p => "₹" + (p/100).toLocaleString("en-IN",
  {minimumFractionDigits:2, maximumFractionDigits:2});

// Gated. No session means /login, rather than an empty workspace that leaves
// somebody wondering what broke.
let USER = null;
fetch("/v1/auth/me", {credentials:"same-origin"})
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => { USER = d.user; paint(); })
  .catch(() => { location.href = "/login"; });

function paint(){
  $("whoami").textContent = USER.email;
  const label = USER.website_name || USER.website_url;
  const first = esc(USER.name.split(" ")[0]);
  $("greet").innerHTML = label
    ? `Hi ${first}, I see you're selling on <a href="${esc(USER.website_url || "#")}"
        target="_blank" rel="noopener">${esc(label)}</a>`
    : `Hi ${first}, let's connect your store`;
}

$("signout").addEventListener("click", async () => {
  await fetch("/v1/auth/logout", {method:"POST", credentials:"same-origin"});
  location.href = "/login";
});

// Two different jobs reach the same box. An integration request gets the tool
// picker; anything else goes to the commerce agent.
const INTEGRATION =
  /(integrat|install|set ?up|connect|add).*(site|website|store|shop|razorpay|payment)|razorpay.*(integrat|set ?up)/i;

const TOOLS = {
  "No code / Low code": ["Claude Code", "Emergent", "Lovable", "Replit"],
  "AI native IDE": ["Cursor", "VS Code", "Codex", "Antigravity"],
};

// ---------------------------------------------------------------- thread
// Once anything is said the page becomes a conversation: hero out, messages
// in, composer docked to the bottom.
function startChat(){
  document.body.classList.add("chatting");
}

function say(who, html){
  startChat();
  const el = document.createElement("div");
  el.className = `bubble ${who}`;
  el.innerHTML = html;
  $("thread").appendChild(el);
  el.scrollIntoView({behavior:"smooth", block:"end"});
  return el;
}

function thinking(label){
  return say("them", `<span class="thinking">${esc(label)}
    <i></i><i></i><i></i></span>`);
}

function showPicker(){
  const el = say("them", `<div class="picker">
    <h3>How did you build your website?</h3>
    ${Object.entries(TOOLS).map(([group, tools]) => `
      <p class="grp">${group}</p>
      <div class="row">${tools.map(t =>
        `<button class="tool" data-tool="${esc(t)}">${esc(t)}</button>`
      ).join("")}</div>`).join("")}
  </div>`);

  el.querySelectorAll("[data-tool]").forEach(b =>
    b.addEventListener("click", () => {
      // Their choice reads back as something they said, because it was.
      say("me", `Get integration prompt for ${esc(b.dataset.tool)}`);
      showPrompt(b.dataset.tool);
    }));
}

async function showPrompt(tool){
  const note = thinking("Let me get your API keys first");

  try {
    // Send back the key this browser was given at signup. The server checks
    // it against the stored hash and writes it into the prompt unchanged, so
    // opening this twice does not produce two keys — the second of which
    // would have broken a storefront already wired with the first.
    //
    // with_key is the fallback: on a new machine there is nothing cached, so
    // a fresh key is minted and the response says so.
    let cached = null;
    try { cached = localStorage.getItem("ccp_browse_key"); } catch (e) {}

    const res = await fetch("/v1/integration-prompt", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify({tool, existing_key: cached, with_key: true}),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `${res.status}`);

    // A mint replaces whatever this browser held.
    if (body.rotated) {
      const issued = (body.prompt.match(/COMMERCE_POLICY_API_KEY=(\S+)/) || [])[1];
      try { if (issued) localStorage.setItem("ccp_browse_key", issued); } catch (e) {}
    }

    note.outerHTML =
      `<div class="bubble them">
         <div class="lead">Found your account. Minting a fresh key and
           writing it into the prompt.</div>
         ${codeCard(`${esc(tool)} integration prompt`, body.prompt)}
         <div class="warn">${esc(body.note)}</div>
       </div>`;
    wireCopy();
    showWhatsApp();
  } catch (err) {
    note.outerHTML =
      `<div class="bubble them"><div class="note">${esc(err.message)}</div></div>`;
  }
}

// The delivery worker holds the WhatsApp session on a machine this page
// cannot reach, and reports its QR code to the control plane. A WhatsApp code
// lasts about twenty seconds, so this polls: whatever is on screen is the one
// that currently works.
let waPoll = null;

function showWhatsApp(){
  const el = say("them", `<div class="wa" id="wa">
    <div class="lead">One more step — connect WhatsApp so receipts reach
      your customers.</div>
    <div class="wabody"><div class="note">Checking your delivery worker…</div></div>
  </div>`);

  const body = el.querySelector(".wabody");
  clearInterval(waPoll);

  const draw = async () => {
    let d;
    try {
      const res = await fetch("/v1/whatsapp/status", {credentials:"same-origin"});
      d = await res.json();
      if (!res.ok) throw new Error(d.detail || res.status);
    } catch (err) {
      body.innerHTML = `<div class="note">${esc(String(err.message))}</div>`;
      return;
    }

    if (d.status === "connected"){
      clearInterval(waPoll);
      body.innerHTML = `<div class="waok">WhatsApp connected${
        d.number ? ` — ${esc(d.number)}` : ""}<br>
        <span class="sm">${esc(d.message)}</span></div>`;
      return;
    }

    if (d.qr){
      // The image is a data URI the worker produced. Rendered as a src rather
      // than injected as markup, so a malformed value fails to load instead of
      // becoming something the page executes.
      const img = document.createElement("img");
      img.className = "qr";
      img.alt = "WhatsApp QR code";
      img.src = d.qr;
      body.replaceChildren(img);
      const hint = document.createElement("div");
      hint.className = "sm";
      hint.textContent = d.message + " Refreshes automatically.";
      body.appendChild(hint);
      return;
    }

    body.innerHTML = `<div class="note">${esc(d.message || "Waiting…")}</div>`;
  };

  draw();
  waPoll = setInterval(draw, 4000);
}

function codeCard(title, text){
  return `<div class="code">
    <div class="codebar">
      <span class="codetitle">${title}</span>
      <button class="copy" type="button">Copy</button>
    </div>
    <pre class="codebody">${esc(text)}</pre>
  </div>`;
}

// Copy is wired after insertion rather than with an inline handler, so the
// prompt text never has to survive a trip through an HTML attribute.
function wireCopy(){
  document.querySelectorAll(".copy:not([data-wired])").forEach(b => {
    b.dataset.wired = "1";
    b.addEventListener("click", async () => {
      const text = b.closest(".code").querySelector(".codebody").textContent;
      try {
        await navigator.clipboard.writeText(text);
        b.textContent = "Copied";
      } catch {
        // Clipboard access is refused in some embedded views. Selecting the
        // text is a worse experience than copying it, and a better one than
        // a button that silently does nothing.
        const range = document.createRange();
        range.selectNodeContents(b.closest(".code").querySelector(".codebody"));
        getSelection().removeAllRanges();
        getSelection().addRange(range);
        b.textContent = "Select all, then copy";
      }
      setTimeout(() => { b.textContent = "Copy"; }, 2500);
    });
  });
}

const MARK = {pass:"PASS", fail:"FAIL", not_configured:"n/a"};
const renderChecks = p => !p ? "" :
  `<div class="checks"><h4>Policy engine</h4>${p.map(c=>{
    const s = c.status || (c.passed ? "pass" : "fail");
    return `<div class="chk ${s}"><span class="m">${MARK[s]||s}</span>
      <span class="r">${esc(c.rule)}</span>
      <span class="w">${esc(c.detail)}</span></div>`;
  }).join("")}</div>`;

function render(r){
  const q = r.quote;
  const body = q ? `
    <ul class="lines">${q.items.map(i=>`
      <li><span>${esc(i.name)}${i.qty>1?` × ${i.qty}`:""}</span>
          <span class="amt">${money(i.line_paise)}</span></li>`).join("")}
    </ul>
    <div class="total"><span class="l">Payable</span>
      <span class="v">${money(q.total_paise)}</span></div>`
    : `<p style="margin:0 0 .8rem;color:var(--muted);font-size:.93rem">${esc(r.message||"")}</p>`;
  return `<div class="panel ${r.approved?"ok":"no"}">
    <p class="verdict ${r.approved?"ok":"no"}">
      ${r.approved?"Approved by the policy engine":"Refused by the policy engine"}</p>
    ${body}${renderChecks(r.policy)}</div>`;
}

// Three jobs arrive through one box.
//
//   integration   the tool picker, answered in the page
//   shopper       what a customer would ask — runs the buying path
//   merchant      everything else — the owner's own agent
//
// No API key appears anywhere below. Both routes authenticate with the
// session cookie, so the merchant is known from who is signed in. An earlier
// version put a browse key in this file, which worked and was wrong: the page
// is served publicly, so the key was published along with it.
async function ask(text, mode){
  say("me", esc(text));
  $("q").value = "";

  if (!mode && INTEGRATION.test(text)) { showPicker(); return; }

  const shopper = mode === "shopper";
  $("go").disabled = true;
  const pending = thinking(shopper
    ? "Retrieving, proposing, checking policy"
    : "Reading your shop");

  try {
    const res = await fetch(shopper ? "/v1/ask/shopper" : "/v1/ask", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      credentials: "same-origin",
      body: JSON.stringify(shopper ? {question: text} : {question: text}),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || `${res.status}`);

    pending.outerHTML = shopper
      ? `<div class="bubble them">${render(body)}</div>`
      : `<div class="bubble them">${renderAnswer(body)}</div>`;
  } catch (err) {
    pending.outerHTML =
      `<div class="bubble them"><div class="note">${esc(err.message)}</div></div>`;
  } finally { $("go").disabled = false; }
}

// The agent's text is assembled from database rows, never written by a model,
// so it arrives as plain lines. Rendered as pre-wrap rather than parsed:
// there is no markup in it, and treating it as HTML would be an injection
// path for whatever a shopper typed into a search box.
function renderAnswer(body){
  const text = `<div class="answer">${esc(body.text || "")}</div>`;
  if (body.tool === "integration_prompt" && body.data && body.data.prompt) {
    return text + `<pre class="prompt">${esc(body.data.prompt)}</pre>`;
  }
  return text;
}

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (q) ask(q);
});
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault();
    $("form").dispatchEvent(new Event("submit")); }
});
// data-try holds a question the merchant is asking about their own shop, so
// it goes to their agent. data-shopper holds a customer's request and runs
// the buying path instead. An earlier version sent every button to the
// shopper route, which meant "import my product catalog" was answered as
// though a customer had asked to buy one.
document.querySelectorAll("[data-try]").forEach(b =>
  b.addEventListener("click", () => ask(b.dataset.try)));
document.querySelectorAll("[data-shopper]").forEach(b =>
  b.addEventListener("click", () => ask(b.dataset.shopper, "shopper")));

// Dismisses the suggestions and leaves the prompt box. Nothing is sent —
// the button says "later", so it must not quietly start something now.
$("later").addEventListener("click", () => {
  document.querySelector(".actions").hidden = true;
  document.querySelector(".cards").hidden = true;
  $("q").focus();
});

// Two jobs happen in one box, and which one is running was previously only
// inferable from what you typed. Naming them puts a shopper request and an
// integration request in different places, which is also how the shopper path
// comes back: it lost its button when that one became "I'll do it later".
let mode = "search";

function setMode(next){
  mode = next;
  $("nav-search").setAttribute("aria-current", String(next === "search"));
  $("nav-integration").setAttribute("aria-current",
    String(next === "integration"));
  $("q").placeholder = next === "integration"
    ? "Ask about connecting your store, or say \"integrate with my website\"…"
    : "Ask for anything — shop the way a customer would…";
}

$("nav-search").addEventListener("click", () => { setMode("search"); $("q").focus(); });
$("nav-integration").addEventListener("click", () => {
  setMode("integration");
  say("me", "Show me what I can connect");
  showConnections();
});
setMode("search");

// What a merchant can plug in, with each one's real state rather than a row

// then found to be unbuilt costs more trust than one labelled honestly.

      1 0 12 2Zm0 18a8.1 8.1 0 0 1-4.1-1.1l-.3-.2l-3 .8l.8-2.9l-.2-.3A8.1 8.1

      a5.1 5.1 0 0 0 1.1 2.7a11.6 11.6 0 0 0 4.4 3.9c1.6.7 2.3.7 3.1.6
      a2.6 2.6 0 0 0 1.7-1.2a2.1 2.1 0 0 0 .1-1.2Z"/></svg>`,

  facebook: `<svg viewBox="0 0 24 24" aria-hidden="true">
    <path fill="#0866FF" d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06
      c0 5 3.66 9.15 8.44 9.94v-7H7.9v-2.9h2.54V9.85c0-2.52 1.5-3.91

      1.57v1.89h2.78l-.45 2.9h-2.33v7A10 10 0 0 0 22 12.06Z"/></svg>`,

      22Z"/>
    <path fill="#FBBC05" d="M6.41 13.92a6 6 0 0 1 0-3.83V7.5H3.07a10 10 0 0 0
      0 9l3.34-2.58Z"/>
    <path fill="#EA4335" d="M12 5.98c1.47 0 2.79.51 3.83 1.5l2.86-2.86
      C16.95 2.99 14.7 2 12 2A10 10 0 0 0 3.07 7.5l3.34 2.59C7.2 7.73 9.4 5.98
      12 5.98Z"/></svg>`,
};

const CONNECTIONS = [
  {id:"website", name:"Your website", ready:true, what:"Agentic search",
   action:"Get the prompt"},
  {id:"whatsapp", name:"WhatsApp", ready:true, what:"Receipts and offers",
   action:"Connect"},
  {id:"facebook", name:"Meta Ads", ready:false, what:"Facebook, Instagram",
   action:"Authorise",
   href:"https://onboard.windsor.ai/connect?connector=facebook&client=CLAUDE&next=/facebook/authorize"},
  {id:"google_ads", name:"Google Ads", ready:false, what:"Search campaigns",
   action:"Authorise",
   href:"https://onboard.windsor.ai/connect?connector=google_ads&client=CLAUDE&next=/google_ads/authorize"},
];

function showConnections(){
  const el = say("them", `<div class="picker">
    <h3>What would you like to connect?</h3>
    <div class="conns">${CONNECTIONS.map(c => `
      <button class="conn" data-conn="${c.id}">
        ${c.ready ? "" : `<span class="soon">read-only</span>`}
        ${LOGOS[c.id]}
        <p class="connname">${esc(c.name)}</p>
        <p class="connwhat">${esc(c.what)}</p>
      </button>`).join("")}</div>
  </div>`);

  el.querySelectorAll("[data-conn]").forEach(b =>
    b.addEventListener("click", () => {
      const conn = CONNECTIONS.find(c => c.id === b.dataset.conn);
      say("me", `${conn.action} — ${conn.name}`);

      if (conn.id === "website") { showPicker(); return; }
      if (conn.id === "whatsapp") { showWhatsApp(); return; }

      // Ad accounts are authorised at the provider, so this leaves the page.
      // Opened rather than navigated, so the merchant does not lose the
      // prompt they were partway through.
      window.open(conn.href, "_blank", "noopener");
      say("them", `<div class="note">A window opened to authorise
        <b>${esc(conn.name)}</b>. Sign in there and grant access to the ad
        account you want read.<br><br>Reading campaign spend against your real
        margin works once that is done. Changing budgets automatically is not
        built yet — it is the next thing.</div>`);
    }));
}
</script>
