[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commerce-policy"
version = "1.2.0"
description = "Deterministic pricing guardrail for AI shopping agents. The model proposes; this decides."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["commerce", "pricing", "policy", "agents", "razorpay", "margin"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Intended Audience :: Developers",
]

# psycopg only. No model client, no HTTP library, no framework — this package
# runs on a merchant's server and every dependency it adds is one they have to
# accept, patch and keep.
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
commerce-policy = "commerce_policy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["commerce_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
